name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A PR's newer push stops its older run; each run on main finishes (its
# caches and dx rows are what the PRs on top start from).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job's Rust cache is saved by main's runs only, read by the PRs on
# top: PR caches would push main's out of the repository's 10 GB.
jobs:
  # ./ci.sh's parts side by side, each on its own runner: `lint` (fmt, the
  # repo's gates, clippy everywhere, docs, air's IR rule) and `test` (the
  # Linux tests); its dx part is the `dx` jobs below.
  check:
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 xvfb ffmpeg
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What `ax setup` fetches (the Electron runtime the UI tests draw in,
      # the lock's wasm-bindgen), kept per pinned version.
      - id: pins
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        if: matrix.part == 'test'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/aio/electron
            ~/.local/share/aio-rt/tools
          key: aio-tools-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - if: matrix.part == 'test' && steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- setup
      - run: ./ci.sh ${{ matrix.part }}
  # Known breaks planted one at a time, in the source and in a built .deb:
  # each one's test must go red (docs/testing/proving.md).
  mutants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: pins
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/aio/electron
            ~/.local/share/aio-rt/tools
          key: aio-tools-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- setup
      - run: scripts/mutants --fast
  # ./ci.sh's dx part (scripts/dx-metrics), its two parts side by side: the
  # template (its builds, packages, web build and live edits) and its APKs
  # (`ax build --android`, the runner's SDK and NDK). Each measures the commit before (a PR's merge:
  # main's head) on its own runner too and holds the sizes to it; that row
  # is kept per commit and machine (`--machine`), so a later run on a runner
  # of the same machine skips the base's build: main's runs keep theirs for
  # the PRs on top.
  dx:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [air, apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - if: matrix.part != 'apk'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - if: matrix.part != 'apk'
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - if: matrix.part == 'apk'
        run: rustup toolchain install && rustup target add armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: pins
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        if: matrix.part != 'apk'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/aio/electron
            ~/.local/share/aio-rt/tools
          key: aio-tools-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - if: matrix.part != 'apk' && steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- setup
      - id: dx
        run: |
          echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          echo "machine=$(scripts/dx-metrics --machine)" >> "$GITHUB_OUTPUT"
      - id: dxrows
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aio-dx-rows
          key: aio-dx-${{ matrix.part }}-rows-${{ steps.dx.outputs.base }}-${{ steps.dx.outputs.machine }}
      - run: scripts/dx-metrics --check --${{ matrix.part }} --base "${{ steps.dx.outputs.base }}" --rows ~/.cache/aio-dx-rows
      - if: always() && (github.event_name == 'push' || steps.dxrows.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aio-dx-rows
          key: aio-dx-${{ matrix.part }}-rows-${{ github.event_name == 'push' && github.sha || steps.dx.outputs.base }}-${{ steps.dx.outputs.machine }}
  # The same tests on each desktop OS (fmt and lint are the same everywhere).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: pins
        shell: bash
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/aio/electron
            ~/AppData/Local/aio/electron
          key: aio-electron-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- runtime --fetch
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      # ax dev's hot-patch, its times: on Windows with MSVC (the runner's
      # Rust) and with MinGW (the runner's), each against a rebuild.
      - run: cargo test -p aio-rs-cli --test hotpatch --locked -- --nocapture
      - if: runner.os == 'Windows'
        run: cargo test -p aio-rs-cli --test hotpatch --locked -- --nocapture
        env:
          AIO_HOTPATCH_TARGET: x86_64-pc-windows-gnu
      # ax dev's live edits on Windows, their times (printed, no row).
      - if: runner.os == 'Windows'
        run: python scripts/dx-metrics --live
      # air's gates (docs/design/air.md) in a release build too.
      - run: cargo test -p aio-rs-air --release --all-features --locked
  # A real install of a sample app updated through the signed delta path,
  # then a broken update rolled back with its data (scripts/update-proof).
  update-proof:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os != 'Windows'
        run: python3 scripts/update-proof
      - if: runner.os == 'Windows'
        run: python scripts/update-proof
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
