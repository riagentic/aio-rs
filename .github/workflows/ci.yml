name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 xvfb ffmpeg
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # What `ax setup` fetches (the Electron runtime the UI tests draw in,
      # dx, the lock's wasm-bindgen), kept per pinned version.
      - id: pins
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/aio/electron
            ~/.local/share/aio-rt/tools
          key: aio-tools-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- setup
      - run: ./ci.sh
  # The same tests on each desktop OS (fmt and lint are the same everywhere).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - id: pins
        shell: bash
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/aio/electron
            ~/AppData/Local/aio/electron
          key: aio-electron-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- runtime --fetch
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      # air (docs/design/air.md): the facade and TestUi on it, its gates in release.
      - run: cargo test -p aio-rs --no-default-features --features air --test air_ui --test facade --test ui --locked --no-fail-fast
      - run: cargo test -p aio-rs-air --release --all-features --locked
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
