name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 xvfb ffmpeg
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # What `ax setup` fetches (the Electron runtime the UI tests draw in,
      # dx, the lock's wasm-bindgen), kept per pinned version.
      - id: pins
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/aio/electron
            ~/.local/share/aio-rt/tools
          key: aio-tools-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- setup
      # dx-metrics' sizes against the commit before (a PR's merge: main's
      # head) measured on this runner (scripts/dx-metrics), its row kept per
      # commit: main's runs keep theirs for the PRs on top.
      - id: dx
        run: echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - id: dxrows
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aio-dx-rows
          key: aio-dx-rows-${{ steps.dx.outputs.base }}
      - run: ./ci.sh
        env:
          AIO_DX_BASE: ${{ steps.dx.outputs.base }}
          AIO_DX_ROWS: ~/.cache/aio-dx-rows
      - if: always() && (github.event_name == 'push' || steps.dxrows.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aio-dx-rows
          key: aio-dx-rows-${{ github.event_name == 'push' && github.sha || steps.dx.outputs.base }}
      # Known breaks planted one at a time, in the source and in a built .deb:
      # each one's test must go red (docs/testing/proving.md).
      - run: scripts/mutants --fast
  # The same tests on each desktop OS (fmt and lint are the same everywhere).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - id: pins
        shell: bash
        run: echo "key=$(sh scripts/ci-pins)" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/aio/electron
            ~/AppData/Local/aio/electron
          key: aio-electron-${{ runner.os }}-${{ steps.pins.outputs.key }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo run --locked -p aio-rs-cli -- runtime --fetch
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      # air (docs/design/air.md): the facade and TestUi on it, its gates in release.
      - run: cargo test -p aio-rs --no-default-features --features air --test air_ui --test facade --test ui --locked --no-fail-fast
      - run: cargo test -p aio-rs-air --release --all-features --locked
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
