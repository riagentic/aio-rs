[package]
name = "air-bench"
description = "air spike measurements: generated 50-view apps, the held-arrow harness"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Only the held-arrow harness (`hold`, Unix sockets) runs an aio app; `gen`
# writes source text.
[target.'cfg(unix)'.dependencies]
aio = { workspace = true, features = ["kit"] }
air = { workspace = true }

[lints]
workspace = true
