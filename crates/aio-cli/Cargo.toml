[package]
name = "aio-rs-cli"
description = "ax, the aio-rs command: make, run, test and ship aio-rs apps"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "gui"]

[[bin]]
name = "ax"
path = "src/main.rs"

[dependencies]
# `testing`: `ax preview`, `ax surface` and `ax shot` drive pages as TestUi does.
aio = { workspace = true, features = ["kit", "net", "testing"] }
# `Config::parse` and `find`: aio.toml as `ax config`, `ax build` and `ax lint` read it.
aio-config = { workspace = true, features = ["toml", "png"] }
# `ax ui`'s Tasks: a project's cargo aliases (`.cargo/config.toml`), aio-config's own toml.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# `ax ui --browser`: the manager served to the browser's tabs (`aio_shell::web`).
aio-shell = { workspace = true, features = ["web"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
base64 = "0.23"
# `ax build --sizes`: a binary's code symbols, by crate. `write`: ax dev's
# hot-patch stub object (`hotpatch.rs`).
object = { version = "0.37", default-features = false, features = ["read", "std", "write"] }
# ax dev's hot-patch: the jump table the app applies (its own type).
aio-hotpatch = { workspace = true }
rustc-demangle = "0.1"
# The default app icon's PNG; an app's own icon scaled for the exe's .ico.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# `ax lint`: Rust parsed as the compiler parses it; rsx! with air's own parser (reload.rs).
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
tokio = { version = "1", features = ["time"] }
# `ax shot`: the DevTools protocol of a window the app opened it for.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[target.'cfg(unix)'.dependencies]
# `ax dev`: its dx ends with it (Linux), a stray one is stopped.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The tests stand in for a running app under `ax dev`: its operator door
# (`ax call`, `ax travel`, metrics) is ax dev's tooling, aio's `dev`.
aio = { workspace = true, features = ["kit", "net", "testing", "dev"] }
# A web build's pages painted by its server (`aio_shell::web::painted`).
aio-shell = { workspace = true, features = ["web"] }
