[package]
name = "aio-rs-shell"
description = "aio-rs's desktop host: the app's view tree in Rust, drawn by the shared Electron runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "aio_shell"

[dependencies]
aio = { workspace = true, features = ["outbound", "web", "kit"] }
# The monogram of an app with no icon, drawn and written as a PNG.
aio-config = { workspace = true, features = ["png"] }
base64 = "0.23"
bytes = "1"
serde = { version = "1", features = ["derive"] }
# The store's ISO times, as aio writes them (`toISOString`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# air, aio-rs's renderer: the windows' views, their frames read for a held key's repeats.
air = { workspace = true }
# `ax dev`'s hot-patch (`dev`): the patch loaded into the running app.
aio-hotpatch = { workspace = true, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Unpacks the runtime's archive: inflate only (the CLI writes archives).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Delta updates: a release made from the version installed (`delta`). `thin`:
# zstd's small build, 60 KB off the app (deps.toml `[kept-features]`).
zstd = { version = "0.14", default-features = false, features = ["thin"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "macros", "fs", "io-util", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[features]
# `updates` on unless an app turns the defaults off, as `ax create`'s
# templates do: ax's builds then turn it on for an `[updates] url`.
default = ["updates"]
# Updates (`update`): the built-in runtime that checks `[updates] url`,
# stages and installs, and the `updates` cell (an app's own runtime,
# `aio::update::install`, too). Without it the app never looks for one and
# carries none of it (~0.5 MB, and as much again of a debug build's aio-rs:
# its `updates`); a new version still confirms its first boot.
updates = ["aio/updates"]
# Nothing more: the views are always air's (the feature an app on air named
# before 0.2.0, `default-features = false, features = ["air"]`, still builds).
air = []
# The app's UI in browsers, served by its own server (`web`): `ax ui
# --browser`'s tabs, and brotli for the web build it serves.
web = ["aio/br"]
# `ax dev` (it passes `--features aio-shell/dev`): Rust hot-patched, `rsx!`
# markup reloaded live. A release build leaves it out.
dev = ["dep:aio-hotpatch", "aio/dev"]
# The splash drawn by the OS before Electron starts (`presplash`): `ax build`
# turns it on for an app with a `[build.splash]`, so an app without one (and
# `ax dev`) carries none of it; Electron draws the splash there.
native-splash = []

[dev-dependencies]
tempfile = "3"
# The update tests read aio.toml text (`Config::parse`).
aio-config = { workspace = true, features = ["toml"] }
# The kit's islands, tested in the real page (`islands.rs`); the window's
# routes (`window_routes.rs`).
aio = { workspace = true, features = ["testing", "server"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[[test]]
name = "web"
required-features = ["web"]

[[test]]
name = "updates_stub"
required-features = ["updates"]

[[test]]
name = "js_client"
required-features = ["web"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
