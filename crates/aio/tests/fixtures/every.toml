[app]
id = "lit"
name = "Lit \"quoted\" ✓"
mode = "client-server"
maintainer = "A <a@example.org>"
version = "1.2-beta"
ui = "browser"
lang = "ar"
dir = "rtl"
tz = "local"
profiles = false
flags = ["--verbose"]
[data]
durability = "full"
store = "vault.db"
retire = ["old.db"]
pragmas = ["PRAGMA cache_size = -16000"]
persist = false
coalesce_ms = 250
backup_every = "1d"
backup_keep = 3
[home]
dir = "/srv/lit"

[history]
keep = "36h"
[server]
listen = "127.0.0.1:8080"
discover = true
local_peers = false
page_log = false
hosts = ["example.org"]
trust_proxy = "x-forwarded-for"
[server.security]
csp = "strict"
hsts = "max-age=60"
directives = { img-src = "'self'", frame-src = false }
[server.limits]
clients = 9
[server.dirs]
"/media" = "media"
[client]
retention = "7d"
timeouts = { "lit.slow" = "60s", "lit.wait" = "off" }
strict_pin = true
transport = "poll"
[accounts]
on = true
max_sessions = 4
totp = false
[capabilities]
network = ["api.example.org", "example.org"]
[updates]
url = "https://example.org/releases"
keys = ["ed25519:k"]
every = "off"
every_by_channel = { dev = "1m" }
prerelease = true
sign_commit = true
[build]
targets = ["deb", { name = "srv", kind = "cli", entry = "lit-server", platforms = ["linux"], title = "Lit Server", ui = "browser" }]
budget_mb = 12
out = "out/bundles"
css = "tailwindcss -i a.css -o b.css"
platforms = ["linux", "macos-arm64"]
runtime = "bundled"
chromium_extras = "strip"
assets = { "/built" = "media" }
[build.android]
application_id = "org.example.lit"
schemes = ["lit"]
camera = true
color_scheme = "light"
universal = true
strict = true
[build.macos]
bundle_id = "org.example.lit"
host = "-p 2222 me@mac"
[build.splash]
image = "splash.png"
text = "Starting {title}"
min_ms = 600
max_ms = 10000
background = ["#fff", "#101418"]
show = "first-start"
download_text = "{title}: {got} / {total} MB"
size = [480, 300]
fit = "cover"
text_position = "over"
align = "left"
margin = 20
radius = 12
border = "#ccc"
font = "serif"
font_size = 18
bold = true
fade_ms = 250
text_color = ["#111", "#eee"]
bar = ["#14f195", "#14f195"]
track = ["#ddd", "#333"]
position = "pointer"
follow_window = false
shadow = true
window_shadow = false
cancel = false
progress = true
bar_style = "thin"
bar_height = 5
bar_position = "bottom-edge"
bar_radius = 2
[build.windows]
shortcut = false
[build.download_window]
heading = "Setting up {title}"
text = "{got} of {total} MB"
question = "{reason}"
background = "#101418"
color = "#eee"
bar = "#14f195"
track = "#333"
cancel = false
[log]
level = "debug"
suppress = ["lit.tick"]
dir = "~/logs/lit"
[perf]
method = 50
call_ceiling = 20000
[perf.methods]
"lit.import" = 5000
[perf.storm]
breaker = true
[memory]
high = 60
[budgets]
state = "1MB"
broadcast_rate = "20.5/s"
[feedback]
url = "https://example.org/fb"
timeout = "30s"
args = true
[ui]
theme = "full"
scheme = "light"
hue = 200
neutral = "soft"
[vitals.loop]
degraded = 10
warning = 20
frozen = 30

[dev]
watch = ["src/ui", "assets"]
