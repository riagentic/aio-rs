# Every crate aio builds, and why: the gate `scripts/deps-check` runs in CI
# (cargo-deny's `[bans]` shape). A crate not listed, an entry no longer used,
# or a second version of a crate without a `skip` fails. Each reason names its
# way in: `package/feature` (core = always), then the direct dependency.
# A ratchet: entries leave as dependencies go; a new one needs its reason.
[bans]
multiple-versions = "deny"
allow = [
    { crate = "adler2", reason = "aio-rs-cli/core via image (png's miniz_oxide)" },
    { crate = "alloc-no-stdlib", reason = "aio-rs/br via brotli" },
    { crate = "alloc-stdlib", reason = "aio-rs/br via brotli" },
    { crate = "android_system_properties", reason = "aio-rs/core via chrono" },
    { crate = "archery", reason = "aio-rs/core via imbl" },
    { crate = "asn1-rs", reason = "aio-rs/tls via rcgen" },
    { crate = "asn1-rs-derive", reason = "aio-rs/tls via rcgen" },
