[workspace]
resolver = "3"
members = ["crates/aio", "crates/aio-config", "crates/aio-config-macro", "crates/aio-macros", "crates/aio-shell", "crates/aio-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/riagentic/aio-rs"
homepage = "https://github.com/riagentic/aio-rs"
readme = "README.md"
keywords = ["app", "event-sourcing", "dioxus", "desktop", "sync"]
categories = ["gui", "database", "development-tools"]

# The crates each other use: one version, the workspace's.
[workspace.dependencies]
aio = { package = "aio-rs", version = "0.1.0", path = "crates/aio", default-features = false }
aio-config = { package = "aio-rs-config", version = "0.1.0", path = "crates/aio-config" }
aio-config-macro = { package = "aio-rs-config-macro", version = "0.1.0", path = "crates/aio-config-macro" }
aio-macros = { package = "aio-rs-macros", version = "0.1.0", path = "crates/aio-macros" }
aio-shell = { package = "aio-rs-shell", version = "0.1.0", path = "crates/aio-shell" }

# Small debug builds: line numbers for our crates, no debug info for the
# ~400 libraries (they made the build dir tens of GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# The libraries optimised a little (ax dev, tests): measured on a large
# app's test build, a held key's work per step 30-40 % less, a cold build 51 -> 62 s,
# a warm rebuild 36 -> 32 s, the build dir 0.99 -> 0.89 GB.
opt-level = 1
